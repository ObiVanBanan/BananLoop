name: Secret history scan

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  gitleaks-history:
    name: Gitleaks across reachable refs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out full repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch pull request head refs
        run: git fetch --no-tags origin '+refs/pull/*/head:refs/remotes/origin/pr/*'

      - name: Pull pinned Gitleaks image
        run: docker pull zricethezav/gitleaks:v8.27.2

      - name: Scan every reachable Git ref
        shell: bash
        run: |
          report="$RUNNER_TEMP/gitleaks-report.json"
          scanner_log="$RUNNER_TEMP/gitleaks.log"

          set +e
          docker run --rm --network=none \\
            --volume "$GITHUB_WORKSPACE:/repo:ro" \\
            --volume "$RUNNER_TEMP:/reports" \\
            --workdir /repo \\
            zricethezav/gitleaks:v8.27.2 \\
            git --log-opts=--all --redact=100 --report-format=json \\
              --report-path=/reports/gitleaks-report.json --exit-code=1 /repo \\
            >"$scanner_log" 2>&1
          scan_status=$?
          set -e

          if [[ "$scan_status" -eq 0 ]]; then
            echo "No Gitleaks findings across reachable refs."
            exit 0
          fi

          if [[ -f "$report" ]]; then
            python - "$report" <<'PY'
          import json
          import sys
          from pathlib import Path

          try:
              findings = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          except (OSError, ValueError):
              findings = None

          if not isinstance(findings, list) or not findings:
              print("Gitleaks history scan failed; raw output is suppressed to prevent secret disclosure.")
          else:
              print(f"Gitleaks found {len(findings)} potential secret(s); values and matched lines are suppressed.")
              for finding in findings:
                  safe = {
                      key: finding.get(key)
                      for key in ("RuleID", "File", "StartLine", "Commit", "Fingerprint")
                      if isinstance(finding.get(key), (str, int))
                  }
                  print("finding " + json.dumps(safe, sort_keys=True))
          PY
          else
            echo "Gitleaks history scan failed; raw output is suppressed to prevent secret disclosure."
          fi
          exit "$scan_status"
