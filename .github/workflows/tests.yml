name: tests

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

# Keep the newest test run for each source branch. Push and pull_request
# events intentionally share a group so duplicate triggers don't queue a
# second full OS/Python matrix for the same head.
concurrency:
  group: tests-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[test]"
      - name: Prepare private Windows pytest root
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:USERPROFILE ".bananloop-pytest-temp"
          New-Item -ItemType Directory -Force -Path $testRoot | Out-Null
          $currentSid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          icacls $testRoot /inheritance:r | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not remove inherited pytest ACL" }
          icacls $testRoot /grant:r "*$($currentSid):(OI)(CI)F" "*S-1-5-18:(OI)(CI)F" "*S-1-5-32-544:(OI)(CI)F" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not apply private pytest ACL" }
          "BANANLOOP_TEST_BASETEMP=$testRoot" >> $env:GITHUB_ENV
      - name: Run pytest on Windows
        if: matrix.os == 'windows-latest'
        run: python -m pytest -p isolate_home --basetemp "$env:BANANLOOP_TEST_BASETEMP"
        env:
          PYTHONPATH: tests/plugins
      - name: Run pytest on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: python -m pytest -p isolate_home
        env:
          PYTHONPATH: tests/plugins
