name: tests

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

# Keep the newest test run for each source branch. Push and pull_request
# events intentionally share a group so duplicate triggers don't queue a
# second full OS/Python matrix for the same head.
concurrency:
  group: tests-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      # Keep the Windows job running even if a Linux matrix entry fails; the
      # platform-specific ACL and reparse-point checks need their own result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[test]"
      - name: Prepare private Windows pytest root
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:USERPROFILE ".bananloop-pytest-temp"
          New-Item -ItemType Directory -Force -Path $testRoot | Out-Null
          $currentSid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          Write-Output "Pytest DACL runner SID: $currentSid"
          $acl = Get-Acl -Path $testRoot
          $acl.SetAccessRuleProtection($true, $false)
          foreach ($rule in @($acl.Access)) { $acl.RemoveAccessRuleAll($rule) }
          $inheritance = [Security.AccessControl.InheritanceFlags]::ContainerInherit -bor `
            [Security.AccessControl.InheritanceFlags]::ObjectInherit
          foreach ($sid in @($currentSid, "S-1-5-18", "S-1-5-32-544")) {
            $identity = [Security.Principal.SecurityIdentifier]::new($sid)
            $rule = [Security.AccessControl.FileSystemAccessRule]::new(
              $identity, [Security.AccessControl.FileSystemRights]::FullControl,
              $inheritance, [Security.AccessControl.PropagationFlags]::None,
              [Security.AccessControl.AccessControlType]::Allow)
            [void]$acl.AddAccessRule($rule)
          }
          Set-Acl -Path $testRoot -AclObject $acl
          $verifiedAcl = Get-Acl -Path $testRoot
          if (-not $verifiedAcl.AreAccessRulesProtected) { throw "Pytest DACL still inherits from USERPROFILE" }
          if (@($verifiedAcl.Access).Count -ne 3) { throw "Pytest DACL contains unexpected access rules" }
          $verifiedAcl.Access | ForEach-Object {
            $sid = $_.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value
            Write-Output "$sid $($_.FileSystemRights) $($_.AccessControlType) inherited=$($_.IsInherited)"
          }
          "BANANLOOP_TEST_BASETEMP=$testRoot" >> $env:GITHUB_ENV
      - name: Run pytest on Windows
        if: matrix.os == 'windows-latest'
        run: python -m pytest -p isolate_home --basetemp "$env:BANANLOOP_TEST_BASETEMP"
        env:
          PYTHONPATH: tests/plugins
      - name: Run pytest on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: python -m pytest -p isolate_home
        env:
          PYTHONPATH: tests/plugins
