name: dashboard-browser

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

concurrency:
  group: dashboard-browser-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[test]"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: PYTHONPATH=src BANANLOOP_BROWSER_LIVE_E2E=1 pytest tests/test_rpdi13_integrated_acceptance.py -q
