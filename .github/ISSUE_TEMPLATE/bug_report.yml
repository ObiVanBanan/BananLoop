name: Bug report
description: Report a reproducible defect in BananLoop
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not post API keys, holdout labels, credentials, or private dataset contents."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Give the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include exact CLI invocation, minimized fixture, and relevant files.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, commit SHA, agent backend and version, sandbox restrictions.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs / evidence
      description: Share test output, campaign state, and evaluator receipts without secrets.
