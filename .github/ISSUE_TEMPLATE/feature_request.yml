name: Feature request
description: Propose a testable capability or workflow improvement
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user workflow and why existing commands are insufficient.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested behavior
      description: What should the system do, and where would human approval be required?
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: Acceptance criteria
      description: How would you measure success without changing evaluator ground truth?
